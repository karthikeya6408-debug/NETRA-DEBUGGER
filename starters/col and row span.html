<!DOCTYPE html>
<html lang = "en">
    <style>
        body{
            background-color: rgb(0, 0, 0);
        }
        table{
            background-color: rgb(255, 255, 255);
        }
    </style>
<body>
    <caption><font size="5" color="red">THIS IS AN EXAMPLE OF ROWSPAN AND COLSPAN</font></caption>
    <table border = "1" cellspacing = "1" cellpadding = "10">
        <tr>
            <th rowspan = "2"><FONT size="4" color="RED">ROLL NO</font></th>
            <th rowspan = "2"><FONT size="4" color="RED">REG.NO</font></th>
            <th colspan = "2"><FONT size="4" color="RED">name</font></th>
        </tr>
        <tr>
            <td><FONT size="4" color="RED">first name</font></td>
            <td><FONT size="4" color="RED">last name</font></td>
        </tr>
        <tr>
            <td>123</td>
            <td>456</td>
            <td>John</td>
            <td>Doe</td>
        </tr>
        <tr>
            <td>456</td>
            <td>85</td>
            <td>jhon</td>
            <td>wick</td>
        </tr>
        <tr>
            <td>789</td>
            <td>85</td>
            <td>jhony</td>
            <td>bhai</td>
        </tr>
    </table>
</body>
</html>
