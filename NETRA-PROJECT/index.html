<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA-ROVER MONITORING SYSTEM</title>
    <link rel="stylesheet"  type="text/css" href="/NETRA-PROJECT/style.css">
</head>

<body>
   <header class ="topbar">
    <!-- this is for logo and title -->
    <div class = "brand">
        <div class = "brand-logo"><font color="#160B2E">N</font></div>
        <div>
            <h1>NETRA</h1>
            <p>ROVER MISSION CONTROL</p>
        </div>
    </div>    
        <!-- This is block for navigation section -->
         <nav>
            <a href="#Dashboard   ">Dashboard</a>
            <a href="#fleet">Fleet</a>
            <a href="#Telemetry">Telemetry</a>
            <a href="#Alerts">Alerts</a>
         </nav>
         <!-- DISPLAYS THE SYSTEM STATUS AND LIVE CLOCK -->
          <div class="header-right">
            <span class ="online-dot">  </span>
            <span>SYSTEM ONLINE</span>
            <strong id ="clock"> --:--:--</strong>
          </div>
          <!-- OPENS THE MISSION DISPATCH PANEL -->
           <button name ="dispatch-open" type="button">+Dispatch Mission</button>
   </header>
   

   <main class="page">

    <!-- kpi card -->
    <!-- displays the important fleet stastics -->
   <section class ="kpi-grid">
    <article class ="kpi-card">
        <span>ROVERS ONLINE</span>
        <h1 id ="online-count">6/6</h1>
        <p>Active rover units</p>
    </article>
    <article class ="kpi-card">
        <span>AVERAGE BATTERY</span>
        <h1 id ="average battery">6/6</h1>
        <p>Fleet Battery Level</p>
    </article>
    <article class ="kpi-card">
        <span>OPEN ALERTS</span>
        <h1 id ="alerts-count">6/6</h1>
        <p></p>
    </article>
    <article class ="kpi-card">
        <span>DISTANCE COVERED</span>
        <h1 id ="distance-count">6/6</h1>
        <p>Total Simulated Distance</p>
    </article>
   </section>
    </main>
</body>

</html>
